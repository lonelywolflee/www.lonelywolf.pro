baseURL = 'https://www.lonelywolf.pro/'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = true
title = 'lonelywolf'
theme = 'lonelywolf'
enableRobotsTXT = true
paginate = 10

[languages]
  [languages.ko]
    locale = 'ko-KR'
    label = '한국어'
    weight = 1
    contentDir = 'content/ko'
    [languages.ko.params]
      description = '기술과 사업을 잇는 빌더'
  [languages.en]
    locale = 'en-US'
    label = 'English'
    weight = 2
    contentDir = 'content/en'
    [languages.en.params]
      description = '15-year engineer who architects business through code'

[languages.ko.menus]
  [[languages.ko.menus.main]]
    name = '소개'
    url = '/ko/about/'
    weight = 1
  [[languages.ko.menus.main]]
    name = '프로젝트'
    url = '/ko/projects/'
    weight = 2
  [[languages.ko.menus.main]]
    name = '블로그'
    url = '/ko/blog/'
    weight = 3

[languages.en.menus]
  [[languages.en.menus.main]]
    name = 'About'
    url = '/en/about/'
    weight = 1
  [[languages.en.menus.main]]
    name = 'Projects'
    url = '/en/projects/'
    weight = 2
  [[languages.en.menus.main]]
    name = 'Blog'
    url = '/en/blog/'
    weight = 3

[params]
  description = '기술과 사업을 잇는 빌더'
  [params.author]
    name = 'Yonghwan Lee'
    headline = '15년차 엔지니어. 코드로 사업을 설계합니다.'
    jobTitle = 'Senior Software Engineer & Business Developer'
  [params.social]
    github = 'lonelywolflee'
    linkedin = 'lonelywolflee'
    email = 'lonelywolf.lee@gmail.com'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = true

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5

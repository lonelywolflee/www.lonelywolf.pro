<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="min-h-screen flex flex-col antialiased">
  {{/* Ambient glow effect */}}
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[600px] pointer-events-none opacity-30 dark-glow"
       style="background: radial-gradient(ellipse at center, rgba(0,240,255,0.08) 0%, transparent 70%); z-index: 0;"></div>
  <div class="light-glow fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[600px] pointer-events-none opacity-0"
       style="background: radial-gradient(ellipse at center, rgba(0,165,176,0.06) 0%, transparent 70%); z-index: 0;"></div>

  {{- partial "nav.html" . -}}
  <main class="flex-1 w-full max-w-6xl mx-auto px-5 sm:px-8 lg:px-12 py-12 relative z-10">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}

  <script>
    (function() {
      const key = 'theme';
      const stored = localStorage.getItem(key);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored ? stored === 'dark' : prefersDark;

      function applyTheme(dark) {
        document.body.classList.toggle('light', !dark);
        document.querySelector('.dark-glow').style.opacity = dark ? '0.3' : '0';
        document.querySelector('.light-glow').style.opacity = dark ? '0' : '0.3';
      }
      applyTheme(isDark);

      document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function() {
          const isNowDark = !document.body.classList.contains('light');
          const willBeDark = !isNowDark;
          applyTheme(willBeDark);
          localStorage.setItem(key, willBeDark ? 'dark' : 'light');
        });

        // Staggered animation on load
        document.querySelectorAll('.stagger-item').forEach(function(el, i) {
          el.style.animationDelay = (i * 0.08) + 's';
          el.classList.add('animate-fade-up');
        });
      });
    })();
  </script>
</body>
</html>
